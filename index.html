<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS-DOS Command Prompt</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; cursor: none; }
  body {
    background: #000;
    font-family: "SVGAFix", "SVGA Fix", "Fixedsys", "Terminal", "Lucida Console", "Courier New", monospace;
    font-weight: bold; font-size: 16px; color: #c0c0c0;
    overflow: hidden; -webkit-font-smoothing: none;
  }
  #screen {
    height: 100vh; overflow-y: auto; padding: 8px 12px 60px 12px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.3;
    scrollbar-width: thin; scrollbar-color: #555 #000;
  }
  #screen::-webkit-scrollbar { width: 12px; }
  #screen::-webkit-scrollbar-track { background: #000; }
  #screen::-webkit-scrollbar-thumb { background: #444; }
  .line { min-height: 1.3em; }
  .red { color: #ff5555; }
  #inputRow { display: flex; align-items: center; }
  #promptLabel { white-space: pre; }
  #inputWrap { position: relative; flex: 1; min-width: 0; height: 1.3em; overflow: hidden; }
  #cmdInput {
    position: absolute; inset: 0; width: 100%;
    background: transparent; border: 0; outline: 0;
    color: inherit; font: inherit; font-weight: bold;
    caret-color: transparent; padding: 0; margin: 0;
  }
  .block-cursor {
    position: absolute; top: 0; left: 0; color: #c0c0c0;
    visibility: hidden; pointer-events: none; white-space: pre;
    animation: blink 1s infinite; z-index: 3;
  }
  @keyframes blink { 0%,49.99%{opacity:1;} 50%,100%{opacity:0;} }
  .measure {
    position: absolute; top: 0; left: -99999px;
    visibility: hidden; white-space: pre; font: inherit; font-weight: bold;
    pointer-events: none;
  }
  #editorOverlay {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column; padding: 8px 12px;
    z-index: 10; cursor: default;
  }
  #editorOverlay.hidden { display: none; }
  #editorTitle { color: #fff; background: #0000aa; padding: 2px 8px; white-space: pre; }
  #editorWrap { position: relative; flex: 1; min-height: 0; }
  #editorArea {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #000; color: #c0c0c0; font: inherit; font-weight: bold;
    border: 0; outline: 0; resize: none; padding: 6px 0;
    white-space: pre; overflow: auto; caret-color: transparent;
    cursor: text; scrollbar-width: thin; scrollbar-color: #555 #000;
  }
  #editorArea::-webkit-scrollbar { width: 12px; height: 12px; }
  #editorArea::-webkit-scrollbar-track { background: #000; }
  #editorArea::-webkit-scrollbar-thumb { background: #444; }
  #editorHint { color: #808080; padding-top: 4px; }
</style>
</head>
<body>

<div id="screen">
  <div id="output"></div>
  <div id="inputRow" class="line">
    <span id="promptLabel">C:\&gt;</span>
    <span id="inputWrap">
      <input id="cmdInput" type="text" spellcheck="false" autocomplete="off" autocapitalize="off">
      <span id="blockCursor" class="block-cursor">▮</span>
      <span id="cmdMeasure" class="measure"></span>
    </span>
  </div>
</div>

<div id="editorOverlay" class="hidden">
  <div id="editorTitle">EDIT</div>
  <div id="editorWrap">
    <textarea id="editorArea" spellcheck="false"></textarea>
    <span id="editorCursor" class="block-cursor">▮</span>
    <span id="editorMeasure" class="measure"></span>
  </div>
  <div id="editorHint">Ctrl+S = Save &amp; Exit&nbsp;&nbsp;|&nbsp;&nbsp;Esc = Cancel</div>
</div>

<script>
/* ========== DOM ========== */
const screenEl = document.getElementById('screen');
const outputEl = document.getElementById('output');
const inputEl  = document.getElementById('cmdInput');
const promptEl = document.getElementById('promptLabel');
const blockCursor  = document.getElementById('blockCursor');
const cmdMeasure   = document.getElementById('cmdMeasure');
const editorOverlay = document.getElementById('editorOverlay');
const editorTitle   = document.getElementById('editorTitle');
const editorArea    = document.getElementById('editorArea');
const editorCursor  = document.getElementById('editorCursor');
const editorMeasure = document.getElementById('editorMeasure');

/* ========== English source strings ========== */
const EN = {
  version:'MS-DOS Version 6.22', badCmd:'Bad command or file name - ',
  fileNotFound:'File not found', invalidPath:'Invalid path', invalidDir:'Invalid directory',
  accessDenied:'Access denied', dirExists:'Directory already exists',
  dirNotEmpty:'Directory not empty', fileExists:'File already exists',
  missingParam:'Required parameter missing', invalidParam:'Invalid parameter',
  fileCopied:'        1 File(s) copied.',
  saving:'Saving', savedTo:'Saved to your computer: ', saveCancelled:'Save cancelled.',
  written:'Written', loadingPy:'Loading Python runtime (first run downloads ~10 MB) ...',
  pyReady:'Python runtime ready.', formatDone:'Format complete.',
  formatWarn1:'WARNING: All data on the virtual disk will be lost!',
  formatWarn2:'To proceed, type: FORMAT C: /Y',
  factoryReset:'Factory settings restored.',
  exit1:'It is now safe to turn off your computer.',
  exit2:'(Refresh this page to restart)',
  volumeIn:' Volume in drive C is MSDOS',
  volumeSerial:' Volume Serial Number is 1A2B-3C4D',
  dirOf:' Directory of ', fileCount:'File(s)', dirCount:'Dir(s)',
  bytesFree:'bytes free', byteUnit:'bytes',
  currentDate:'Current date is ', currentTime:'Current time is ',
  usagePy:'Usage: PY <filename.py>',
  chooseFolder:'Please choose a folder in the dialog ...',
  savedAll:'The whole virtual disk has been saved to the selected folder.',
  cancelled:'Cancelled.', saveFailed:'Save failed: ',
  noFolderSupport:'Folder selection is not supported here; downloading ',
  filesWord:' file(s) ...', allDownloads:'All downloads complete.',
  selectFiles:'Select the file(s) to load into the virtual disk ...', loaded:'Loaded ',
  treeHeader1:'Directory PATH listing', treeHeader2:'Volume Serial Number is 1A2B-3C4D',
  helpTitle:'MS-DOS Command Interpreter 6.22 — available commands:',
  langLoading:'Translating via MyMemory API ...',
  langSet:'Language set to ',
  langUsage:'Usage: LANG <code>    (e.g. LANG ja, LANG fr, LANG zh-CN, LANG de)',
  langHelp:'Supported codes: en zh-CN zh-TW ja ko fr de es pt it ru ar hi th vi id tr pl nl sv da fi no cs el he uk hu ro',
  langFail:'Translation failed: ',

  importConfirm:'Are you sure you want to import the disk? Importing the disk will delete the current information.',
  importDone:'Disk imported successfully.',
  importBad:'Invalid disk file.',
  importPick:'Select a MSDOS_DISK.json file to import ...',
  importCancelled:'Import cancelled.',
  exportDone:'Disk exported successfully.',
  exportName:'MSDOS_DISK.json',

  helpCmds:[
    '  HELP             Show this help screen',
    '  DIR  [path]      List files and subdirectories',
    '  CD   path        Display or change the current directory',
    '  MD   name        Create a directory',
    '  RD   name        Remove an empty directory',
    '  TYPE filename    Display the contents of a text file',
    '  COPY src dst     Copy a file',
    '  DEL  filename    Delete a file',
    '  REN  old new     Rename a file',
    '  EDIT filename    Edit a text file (Ctrl+S saves)',
    '  ECHO text >file  Display text, or write text into a file',
    '  TREE             Show the directory structure as a tree',
    '  CLS              Clear the screen',
    '  VER              Show the version',
    '  DATE / TIME      Show the date / time',
    '',
    '  -- Python --',
    '  PY     file.py   Run a Python script (uses Pyodide/WASM)',
    '  PYTHON file.py   Same as PY',
    '',
    '  -- Language --',
    '  LANG             Show usage',
    '  LANG <code>      Switch UI language (MyMemory API)',
    '',
    '  -- Import / Export the whole disk --',
    '  IMPORT           Import a MSDOS_DISK.json (asks for confirmation)',
    '  IMPORTDATA       Same as IMPORT',
    '  EXPORT           Save the whole disk as MSDOS_DISK.json',
    '',
    '  -- Exchange single files with your real computer --',
    '  SAVE   filename  Save one file to your real computer',
    '  SAVEALL          Save the whole virtual disk to a real folder',
    '  LOAD             Load files from your real computer',
    '',
    '  -- Maintenance --',
    '  FORMAT C: /Y     Erase the virtual disk',
    '  RESET            Restore factory settings',
    '  EXIT             Quit the prompt'
  ]
};
function t(k) { return EN[k] !== undefined ? EN[k] : k; }

/* ========== Translation (MyMemory, free & CORS-enabled) ========== */
let targetLang = null;
const trCache = new Map();

async function translateText(text) {
  if (!targetLang || !text) return text;
  if (trCache.has(text)) return trCache.get(text);
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=en|' + encodeURIComponent(targetLang);
    const r = await fetch(url);
    const data = await r.json();
    const tr = (data && data.responseData && data.responseData.translatedText) || text;
    trCache.set(text, tr);
    return tr;
  } catch (e) {
    return text;
  }
}

async function setLanguage(code) {
  if (!code) { print(t('langUsage')); print(t('langHelp')); return; }

  code = String(code).trim();
  const low = code.toLowerCase();
  if (low === 'zh' || low === 'cn') code = 'zh-CN';
  else if (low === 'tw') code = 'zh-TW';
  else if (low === 'jp') code = 'ja';
  else if (low === 'kr') code = 'ko';
  else if (low === 'se') code = 'sv';

  targetLang = code;
  document.documentElement.lang = code;
  try { localStorage.setItem('msdos-lang', code); } catch (e) {}

  print(t('langLoading'));

  /* 遍历所有带 data-src 的元素；带 data-notrans 的跳过（例如 [Y/N]） */
  const nodes = outputEl.querySelectorAll('[data-src]');
  for (const el of nodes) {
    if (el.dataset.notrans) continue;
    const src = el.dataset.src;
    if (src) el.textContent = await translateText(src);
  }
  print(t('langSet') + code);
}

/* ========== Virtual disk ========== */
let cwd = [];
function defaultDisk() {
  return { name:'C:', type:'dir', children:{
    'DOS': { type:'dir', children:{} },
    'PY':  { type:'dir', children:{} },
    'AUTOEXEC.BAT': { type:'file', content:
      '@ECHO OFF\nPROMPT $P$G\nPATH C:\\DOS;C:\\PY\nSET TEMP=C:\\DOS\nECHO Welcome to MS-DOS 6.22\n' },
    'CONFIG.SYS': { type:'file', content:
      'DEVICE=HIMEM.SYS\nDOS=HIGH,UMB\nFILES=40\nBUFFERS=20\n' },
    'README.TXT': { type:'file', content:
      'MS-DOS Command Prompt\n' +
      '=====================\n\n' +
      'Commands:\n' +
      '  HELP              list every command\n' +
      '  DIR / CD / MD / RD\n' +
      '  TYPE / COPY / DEL / REN\n' +
      '  EDIT <file>       edit a text file\n' +
      '  PY <file.py>      run a Python script\n' +
      '  LANG <code>       switch UI language\n' +
      '  IMPORT / EXPORT   whole-disk backup as JSON\n' +
      '  SAVE / SAVEALL / LOAD\n' +
      '  FORMAT / RESET / EXIT\n' },
    'HELLO.PY': { type:'file', content:
      '# HELLO.PY - a tiny Python demo\n' +
      'print("Hello from Python!")\n' +
      'print("2 + 3 =", 2 + 3)\n\n' +
      'for i in range(5):\n    print("count:", i)\n' }
  }};
}
let disk = defaultDisk();
function saveDisk() { try { localStorage.setItem('msdos-disk-v1', JSON.stringify({disk,cwd})); } catch(e){} }
function loadDisk() {
  try { const r = localStorage.getItem('msdos-disk-v1'); if (!r) return;
    const d = JSON.parse(r); if (d && d.disk) { disk = d.disk; cwd = d.cwd || []; }
  } catch(e){}
}

/* ========== Path helpers ========== */
function parsePath(str, base) {
  str = String(str==null?'':str).trim();
  let parts;
  if (!str) return [...base];
  if (str.startsWith('\\') || str.startsWith('/') || /^[A-Za-z]:/.test(str)) {
    parts = []; str = str.replace(/^[A-Za-z]:/,'').replace(/^[\\\/]+/,'');
  } else { parts = [...base]; }
  for (const seg of str.split(/[\\\/]+/)) {
    if (!seg || seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg.toUpperCase());
  }
  return parts;
}
function getNode(p) { let n = disk; for (const s of p) { if (!n.children || !n.children[s]) return null; n = n.children[s]; } return n; }
function getParent(p) { return getNode(p.slice(0, -1)); }
function pathString(p) { return 'C:\\' + p.join('\\'); }
function promptString() { return pathString(cwd) + '>'; }
function updatePrompt() { promptEl.textContent = promptString(); refreshCmdCursor(); }

/* ========== Output ========== */
function print(text, skipTranslate) {
  const div = document.createElement('div');
  div.className = 'line';
  const s = (text===undefined||text===null) ? '' : String(text);
  div.dataset.src = s;
  div.textContent = s;
  outputEl.appendChild(div);
  scrollBottom();
  if (!skipTranslate && targetLang && s) {
    translateText(s).then(tr => { div.textContent = tr; });
  }
}
function printRaw(text) { print(text, true); }
function scrollBottom() { screenEl.scrollTop = screenEl.scrollHeight; }

/* ========== Helpers ========== */
function padName(n) { n = String(n); return n.length >= 12 ? n.slice(0,12) : n.padEnd(12,' '); }
function sizeStr(n) { return String(n).padStart(9, ' '); }
function dateStr() {
  const d = new Date(), p = x => String(x).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())}-${String(d.getFullYear()).slice(-2)}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function tokenize(line) {
  const out = []; let cur = '', q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; continue; }
    if (!q && /\s/.test(ch)) { if (cur) { out.push(cur); cur=''; } continue; }
    cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function splitRedirect(line) {
  let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { q = !q; continue; }
    if (!q && ch === '>') return { cmd: line.slice(0,i).trim(), out: line.slice(i+1).trim() };
  }
  return { cmd: line.trim(), out: null };
}

/* ========== Y/N confirmation ========== */
let pendingConfirm = null;

/**
 * 红色确认行。
 * - question 部分会跟随 LANG 翻译
 * - "[Y/N]" 部分固定显示，永不翻译
 */
function confirmYesNo(question, onYes, onNo) {
  const div = document.createElement('div');
  div.className = 'line red';

  const qSpan = document.createElement('span');
  qSpan.dataset.src = question;
  qSpan.textContent = question;
  div.appendChild(qSpan);

  const ynSpan = document.createElement('span');
  ynSpan.dataset.notrans = '1';       /* 关键：不会被翻译 */
  ynSpan.textContent = ' [Y/N] ';
  div.appendChild(ynSpan);

  outputEl.appendChild(div);
  scrollBottom();

  if (targetLang) {
    translateText(question).then(tr => { qSpan.textContent = tr; });
  }
  pendingConfirm = { onYes, onNo };
}

/* ========== Block cursors ========== */
function measureCmdText(text) { cmdMeasure.textContent = text; return cmdMeasure.getBoundingClientRect().width; }
function refreshCmdCursor() {
  if (document.activeElement !== inputEl) { blockCursor.style.visibility = 'hidden'; return; }
  const before = inputEl.value.slice(0, inputEl.selectionStart);
  const w = measureCmdText(before);
  blockCursor.style.visibility = 'visible';
  blockCursor.style.transform = 'translateX(' + (w - inputEl.scrollLeft) + 'px)';
}
function refreshEditorCursor() {
  if (editorOverlay.classList.contains('hidden') || document.activeElement !== editorArea) {
    editorCursor.style.visibility = 'hidden'; return;
  }
  const cs = getComputedStyle(editorArea);
  const fontSize   = parseFloat(cs.fontSize) || 16;
  const lineHeight = parseFloat(cs.lineHeight) || (fontSize * 1.3);
  const padLeft = parseFloat(cs.paddingLeft) || 0;
  const padTop  = parseFloat(cs.paddingTop) || 0;
  const text  = editorArea.value.slice(0, editorArea.selectionStart);
  const lines = text.split('\n');
  const colText = lines[lines.length - 1];
  editorMeasure.textContent = colText;
  const w = editorMeasure.getBoundingClientRect().width;
  editorCursor.style.visibility = 'visible';
  editorCursor.style.transform = 'translate(' + (padLeft + w - editorArea.scrollLeft) + 'px, ' +
    (padTop + (lines.length-1)*lineHeight - editorArea.scrollTop) + 'px)';
}

/* ========== Python (Pyodide) ========== */
let pyodidePromise = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}
async function getPyodide() {
  if (pyodidePromise) return pyodidePromise;
  pyodidePromise = (async () => {
    print(t('loadingPy'));
    if (!window.loadPyodide) await loadScript('https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js');
    const py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' });
    py.globals.set('__js_input__', p => { const r = window.prompt(p||''); return r===null?'':r; });
    await py.runPythonAsync(
      'import builtins\n' +
      'def _msdos_input(prompt=""):\n    return __js_input__(prompt)\n' +
      'builtins.input = _msdos_input\n');
    print(t('pyReady'));
    return py;
  })();
  return pyodidePromise;
}
async function cmdPy(args) {
  if (!args.length) { print(t('usagePy')); return; }
  const fileName = args[0];
  const p = parsePath(fileName, cwd);
  const node = getNode(p);
  if (!node) { print(t('fileNotFound') + ' - ' + fileName); return; }
  if (node.type === 'dir') { print(t('accessDenied') + ' - ' + fileName); return; }
  let py;
  try { py = await getPyodide(); } catch (e) { print('Error: ' + e.message); return; }
  py.setStdout({ batched: s => printRaw(s) });
  py.setStderr({ batched: s => printRaw(s) });
  py.globals.set('__msdos_argv__', py.toPy([fileName]));
  try {
    await py.runPythonAsync('import sys\nsys.argv = list(__msdos_argv__)\n' + node.content);
  } catch (err) {
    printRaw('Traceback (most recent call last):');
    printRaw(String(err.message || err).replace(/^PythonError:\s*/, ''));
  } finally {
    try { py.setStdout({}); py.setStderr({}); } catch(e){}
  }
}

/* ========== Commands ========== */
function cmdHelp() {
  print(t('helpTitle'));
  print('');
  EN.helpCmds.forEach(print);
}
function cmdLang(args) { setLanguage(args[0]); }

function cmdDir(args) {
  const target = args[0] || '';
  const p = target ? parsePath(target, cwd) : [...cwd];
  const node = getNode(p);
  if (!node) { print(t('invalidPath') + ' - ' + target); return; }
  print(t('volumeIn')); print(t('volumeSerial')); print('');
  if (node.type === 'file') {
    print(t('dirOf') + pathString(p.slice(0,-1))); print('');
    print(padName(p[p.length-1]) + ' ' + sizeStr(node.content.length) + '  ' + dateStr());
    print('        1 ' + t('fileCount') + ' ' + sizeStr(node.content.length) + ' ' + t('byteUnit'));
    return;
  }
  print(t('dirOf') + pathString(p)); print('');
  if (p.length > 0) {
    print(padName('.')  + ' <DIR>          ' + dateStr());
    print(padName('..') + ' <DIR>          ' + dateStr());
  }
  let files = 0, dirs = 0, total = 0;
  for (const name of Object.keys(node.children).sort()) {
    const c = node.children[name];
    if (c.type === 'dir') { dirs++; print(padName(name) + ' <DIR>          ' + dateStr()); }
    else { files++; total += c.content.length; print(padName(name) + ' ' + sizeStr(c.content.length) + '  ' + dateStr()); }
  }
  print('       ' + String(files).padStart(3) + ' ' + t('fileCount') + ' ' + sizeStr(total) + ' ' + t('byteUnit'));
  print('       ' + String(dirs).padStart(3) + ' ' + t('dirCount') + '  536,870,912 ' + t('bytesFree'));
}

function cmdCd(args) {
  if (!args.length) { print(pathString(cwd)); return; }
  const p = parsePath(args[0], cwd);
  const n = getNode(p);
  if (!n || n.type !== 'dir') { print(t('invalidDir')); return; }
  cwd = p; updatePrompt(); saveDisk();
}
function cmdMd(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const p = parsePath(args[0], cwd);
  const parent = getParent(p);
  if (!parent || parent.type !== 'dir') { print(t('invalidPath')); return; }
  const name = p[p.length-1];
  if (parent.children[name]) { print(t('dirExists')); return; }
  parent.children[name] = { type:'dir', children:{} }; saveDisk();
}
function cmdRd(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const p = parsePath(args[0], cwd);
  const parent = getParent(p), name = p[p.length-1];
  if (!parent || !parent.children[name]) { print(t('invalidPath')); return; }
  const node = parent.children[name];
  if (node.type !== 'dir') { print(t('invalidDir')); return; }
  if (Object.keys(node.children).length) { print(t('dirNotEmpty')); return; }
  delete parent.children[name]; saveDisk();
}
function cmdDel(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const p = parsePath(args[0], cwd);
  const parent = getParent(p), name = p[p.length-1];
  if (!parent || !parent.children[name]) { print(t('fileNotFound')); return; }
  if (parent.children[name].type === 'dir') { print(t('accessDenied')); return; }
  delete parent.children[name]; saveDisk();
}
function cmdType(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const node = getNode(parsePath(args[0], cwd));
  if (!node) { print(t('fileNotFound')); return; }
  if (node.type === 'dir') { print(t('accessDenied')); return; }
  printRaw(node.content.replace(/\n$/, ''));
}
function cmdCopy(args) {
  if (args.length < 2) { print(t('missingParam')); return; }
  const srcP = parsePath(args[0], cwd);
  const src = getNode(srcP);
  if (!src || src.type !== 'file') { print(t('fileNotFound')); return; }
  let dstP = parsePath(args[1], cwd);
  const dstNode = getNode(dstP);
  if (dstNode && dstNode.type === 'dir') dstP = [...dstP, srcP[srcP.length-1]];
  const parent = getParent(dstP);
  if (!parent || parent.type !== 'dir') { print(t('invalidPath')); return; }
  parent.children[dstP[dstP.length-1]] = { type:'file', content: src.content };
  saveDisk(); print(t('fileCopied'));
}
function cmdRen(args) {
  if (args.length < 2) { print(t('missingParam')); return; }
  const oldP = parsePath(args[0], cwd);
  const parent = getParent(oldP), oldName = oldP[oldP.length-1];
  if (!parent || !parent.children[oldName]) { print(t('fileNotFound')); return; }
  const newName = args[1].replace(/[\\\/]/g, '').toUpperCase();
  if (!newName) { print(t('invalidParam')); return; }
  if (parent.children[newName]) { print(t('fileExists')); return; }
  parent.children[newName] = parent.children[oldName];
  delete parent.children[oldName]; saveDisk();
}
function cmdEcho(args, out) {
  const text = args.join(' ');
  if (out) {
    const p = parsePath(out, cwd);
    const parent = getParent(p);
    if (!parent || parent.type !== 'dir') { print(t('invalidPath')); return; }
    parent.children[p[p.length-1]] = { type:'file', content: text + '\n' };
    saveDisk(); return;
  }
  print(text);
}
function cmdCls() { outputEl.innerHTML = ''; }
function cmdVer() { print(''); print(t('version') + '  (HTML simulation)'); print('Python runtime: Pyodide 0.24.1'); print(''); }
function cmdDate() {
  const d = new Date();
  print(t('currentDate') + d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'));
}
function cmdTime() {
  const d = new Date();
  print(t('currentTime') + String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0'));
}
function cmdTree(args) {
  const p = args.length ? parsePath(args[0], cwd) : [...cwd];
  const node = getNode(p);
  if (!node || node.type !== 'dir') { print(t('invalidDir')); return; }
  print(t('treeHeader1')); print(t('treeHeader2')); print(pathString(p));
  (function walk(n, prefix) {
    const keys = Object.keys(n.children).sort();
    keys.forEach((k, i) => {
      const last = i === keys.length - 1;
      const child = n.children[k];
      print(prefix + (last ? '└───' : '├───') + k);
      if (child.type === 'dir') walk(child, prefix + (last ? '    ' : '│   '));
    });
  })(node, '');
}

/* ---- IMPORT / EXPORT ---- */
function cmdImport() {
  /* 问题句会跟随 LANG 翻译；[Y/N] 固定不翻译 */
  confirmYesNo(t('importConfirm'), () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        const data = JSON.parse(text);
        if (data && data.disk) {
          disk = data.disk;
          cwd = data.cwd || [];
          saveDisk();
          updatePrompt();
          print(t('importDone'));
        } else {
          print(t('importBad'));
        }
      } catch (e) {
        print(t('importBad'));
      }
    };
    inp.click();
    print(t('importPick'));
  }, () => {
    print(t('importCancelled'));
  });
}

async function cmdExport() {
  const json = JSON.stringify({ disk, cwd }, null, 2);
  const ok = await saveFileToRealPC(t('exportName'), json);
  print(ok ? t('exportDone') : t('cancelled'));
}

/* ---- EDIT ---- */
let editingPath = null;
function cmdEdit(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const p = parsePath(args[0], cwd);
  const node = getNode(p);
  if (node && node.type === 'dir') { print(t('accessDenied')); return; }
  editingPath = p;
  editorTitle.textContent = '  EDIT  ' + pathString(p);
  editorArea.value = node ? node.content : '';
  editorOverlay.classList.remove('hidden');
  editorArea.focus();
  editorArea.selectionStart = editorArea.selectionEnd = 0;
  editorArea.scrollTop = 0; editorArea.scrollLeft = 0;
  refreshEditorCursor();
}
function closeEditor() {
  editorOverlay.classList.add('hidden');
  editingPath = null;
  editorCursor.style.visibility = 'hidden';
  inputEl.focus(); refreshCmdCursor();
}
editorArea.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeEditor(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (editingPath) {
      const parent = getParent(editingPath);
      if (parent && parent.type === 'dir') {
        parent.children[editingPath[editingPath.length-1]] = { type:'file', content: editorArea.value };
        saveDisk();
        print(t('written') + ' ' + editingPath[editingPath.length-1] +
              ' (' + editorArea.value.length + ' ' + t('byteUnit') + ')');
      }
    }
    closeEditor();
  }
});

/* ========== Real-computer file exchange ========== */
async function saveFileToRealPC(filename, content) {
  const blob = new Blob([content], { type:'text/plain;charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: filename });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}
async function writeTree(dirHandle, node) {
  for (const [name, child] of Object.entries(node.children)) {
    if (child.type === 'dir') {
      const sub = await dirHandle.getDirectoryHandle(name, { create: true });
      await writeTree(sub, child);
    } else {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(new Blob([child.content], { type:'text/plain;charset=utf-8' }));
      await w.close();
    }
  }
}
function collectFiles(node, prefix, out) {
  out = out || [];
  for (const [name, child] of Object.entries(node.children)) {
    if (child.type === 'dir') collectFiles(child, prefix + name + '_', out);
    else out.push({ name: prefix + name, content: child.content });
  }
  return out;
}
async function cmdSave(args) {
  if (!args.length) { print(t('missingParam')); return; }
  const p = parsePath(args[0], cwd);
  const node = getNode(p);
  if (!node || node.type !== 'file') { print(t('fileNotFound')); return; }
  const fname = p[p.length-1];
  print(t('saving') + ' ' + fname + ' ...');
  const ok = await saveFileToRealPC(fname, node.content);
  print(ok ? t('savedTo') + fname : t('saveCancelled'));
}
async function cmdSaveAll() {
  if (window.showDirectoryPicker) {
    try {
      print(t('chooseFolder'));
      const dir = await window.showDirectoryPicker({ mode:'readwrite' });
      await writeTree(dir, disk);
      print(t('savedAll')); return;
    } catch (err) {
      if (err && err.name === 'AbortError') { print(t('cancelled')); return; }
      print(t('saveFailed') + err.message); return;
    }
  }
  const files = collectFiles(disk, '');
  print(t('noFolderSupport') + files.length + t('filesWord'));
  for (const f of files) { await saveFileToRealPC(f.name, f.content); await sleep(350); }
  print(t('allDownloads'));
}
function cmdLoad() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = async () => {
    const target = getNode(cwd);
    if (!target) return;
    for (const f of inp.files) {
      const text = await f.text();
      const name = f.name.toUpperCase();
      target.children[name] = { type:'file', content: text };
      print(t('loaded') + name + ' (' + text.length + ' ' + t('byteUnit') + ')');
    }
    saveDisk();
  };
  inp.click();
  print(t('selectFiles'));
}
function cmdFormat(args) {
  const ok = args.some(a => ['/Y','/Q'].includes(a.toUpperCase()));
  if (!ok) { print(t('formatWarn1')); print(t('formatWarn2')); return; }
  disk = { name:'C:', type:'dir', children:{ 'DOS':{type:'dir',children:{}}, 'PY':{type:'dir',children:{}} } };
  cwd = []; saveDisk(); updatePrompt(); print(t('formatDone'));
}
function cmdReset() {
  disk = defaultDisk(); cwd = []; saveDisk(); updatePrompt();
  print(t('factoryReset'));
}
function cmdExit() { print(''); print(t('exit1')); print(t('exit2')); }

/* ========== Command table ========== */
const COMMANDS = {
  HELP: cmdHelp, '?': cmdHelp,
  DIR: cmdDir, DIRECTORY: cmdDir,
  CD: cmdCd, CHDIR: cmdCd,
  MD: cmdMd, MKDIR: cmdMd,
  RD: cmdRd, RMDIR: cmdRd,
  DEL: cmdDel, ERASE: cmdDel,
  TYPE: cmdType, COPY: cmdCopy,
  REN: cmdRen, RENAME: cmdRen,
  ECHO: cmdEcho, CLS: cmdCls, VER: cmdVer,
  DATE: cmdDate, TIME: cmdTime, TREE: cmdTree,
  EDIT: cmdEdit,
  PY: cmdPy, PYTHON: cmdPy,
  LANG: cmdLang, LANGUAGE: cmdLang,
  IMPORT: cmdImport, IMPORTDATA: cmdImport,
  EXPORT: cmdExport,
  SAVE: cmdSave, SAVEALL: cmdSaveAll, LOAD: cmdLoad,
  FORMAT: cmdFormat, RESET: cmdReset, EXIT: cmdExit
};

async function runCommand(line) {
  const { cmd, out } = splitRedirect(line);
  const tokens = tokenize(cmd);
  if (!tokens.length) return;
  const name = tokens[0].toUpperCase();
  const args = tokens.slice(1);
  const fn = COMMANDS[name];
  if (!fn) { print(t('badCmd') + tokens[0]); return; }
  await fn(args, out);
}

/* ========== Input handling ========== */
let history = [], histIdx = 0;
inputEl.addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const line = inputEl.value;
    inputEl.value = '';

    if (pendingConfirm) {
      print(promptString() + line);
      const ans = line.trim().toUpperCase();
      const pc = pendingConfirm;
      pendingConfirm = null;
      if (ans === 'Y' || ans === 'YES') {
        try { await pc.onYes(); } catch (err) { print('Error: ' + err.message); }
      } else if (ans === 'N' || ans === 'NO') {
        try { await pc.onNo(); } catch (err) { print('Error: ' + err.message); }
      } else {
        print(t('badCmd') + line);
      }
      updatePrompt(); scrollBottom();
      inputEl.focus(); refreshCmdCursor();
      return;
    }

    if (line.trim()) history.push(line);
    histIdx = history.length;
    print(promptString() + line);
    try { await runCommand(line); }
    catch (err) { print('Error: ' + err.message); console.error(err); }
    updatePrompt(); scrollBottom();
    inputEl.focus(); refreshCmdCursor();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.max(0, histIdx - 1);
    inputEl.value = history[histIdx] || '';
    setTimeout(() => { inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length; refreshCmdCursor(); }, 0);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.min(history.length, histIdx + 1);
    inputEl.value = history[histIdx] || '';
    setTimeout(() => { inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length; refreshCmdCursor(); }, 0);
  }
  setTimeout(refreshCmdCursor, 0);
});
['input','keyup','click','select','focus','blur','mouseup','compositionend','scroll'].forEach(ev => {
  inputEl.addEventListener(ev, () => setTimeout(refreshCmdCursor, 0));
});
document.addEventListener('selectionchange', () => {
  if (document.activeElement === inputEl) refreshCmdCursor();
  if (document.activeElement === editorArea) refreshEditorCursor();
});
window.addEventListener('resize', () => { refreshCmdCursor(); refreshEditorCursor(); });
['input','keyup','keydown','click','select','focus','blur','mouseup','scroll','compositionend'].forEach(ev => {
  editorArea.addEventListener(ev, () => setTimeout(refreshEditorCursor, 0));
});
screenEl.addEventListener('click', e => {
  if (e.target === inputEl) return;
  if (window.getSelection().toString()) return;
  inputEl.focus(); refreshCmdCursor();
});

/* ========== Boot ========== */
(function boot() {
  loadDisk();
  updatePrompt();
  print(t('version'));
  print('');

  try {
    const saved = localStorage.getItem('msdos-lang');
    if (saved) { targetLang = saved; document.documentElement.lang = saved; }
  } catch (e) {}

  inputEl.focus();
  refreshCmdCursor();
})();

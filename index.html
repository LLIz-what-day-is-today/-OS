<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>-OS Command Prompt</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; cursor: none; }
  body {
    background: #000;
    font-family: "SVGAFix", "SVGA Fix", "Fixedsys", "Terminal", "Lucida Console", "Courier New", monospace;
    font-weight: bold; font-size: 16px; color: #c0c0c0;
    overflow: hidden; -webkit-font-smoothing: none;
  }

  /* ============ 顶部按键栏（仅触摸设备显示） ============ */
  #topWrap { position: fixed; top: 0; left: 0; right: 0; z-index: 30; pointer-events: none; }

  #mobileKeys {
    display: none;
    gap: 3px;
    padding: calc(6px + env(safe-area-inset-top)) 6px 6px;
    background: #0a0a0a;
    pointer-events: auto;
    user-select: none; -webkit-user-select: none;
  }
  body.touch #mobileKeys { display: flex; }
  body.desktop #mobileKeys { display: none; }

  #mobileKeys button {
    flex: 1 1 0; min-width: 0;
    background: #1a1a1a; border: 1px solid #444; color: #c0c0c0;
    font: inherit; font-weight: bold; font-size: 13px;
    padding: 10px 0; border-radius: 4px;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; white-space: nowrap;
  }
  #mobileKeys button.active { background: #0000aa; border-color: #5555ff; color: #fff; }
  #mobileKeys button:active { background: #222; }

  #keyboardPanel {
    background: #0a0a0a; padding: 0 4px;
    pointer-events: auto;
    max-height: 0; overflow: hidden;
    transition: max-height 0.25s ease, padding 0.25s ease;
    user-select: none; -webkit-user-select: none;
  }
  #keyboardPanel.visible { max-height: 300px; padding: 6px 4px 8px; }

  .kb-row { display: flex; gap: 3px; margin-bottom: 3px; justify-content: center; }
  .kb-row:last-child { margin-bottom: 0; }
  .kb-row[data-row="q2"] { padding: 0 4%; }
  .kb-row[data-row="q3"] { padding: 0 10%; }

  .kb-key {
    flex: 1 1 0; min-width: 0;
    background: #1a1a1a; border: 1px solid #444; color: #c0c0c0;
    font: inherit; font-weight: bold; font-size: 14px;
    padding: 9px 0; border-radius: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    white-space: nowrap; text-align: center;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .kb-key.active { background: #0000aa; border-color: #5555ff; color: #fff; }

  /* ============ 命令行屏幕 ============ */
  #screen {
    height: 100vh; overflow-y: auto;
    padding: 8px 12px 60px 12px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.3;
    scrollbar-width: thin; scrollbar-color: #555 #000;
    transition: padding-top 0.25s ease;
  }
  body.touch #screen { padding-top: calc(60px + env(safe-area-inset-top)); }
  body.touch.kb-open #screen { padding-top: calc(60px + 220px + env(safe-area-inset-top)); }
  #screen::-webkit-scrollbar { width: 12px; }
  #screen::-webkit-scrollbar-track { background: #000; }
  #screen::-webkit-scrollbar-thumb { background: #444; }

  .line { min-height: 1.3em; }
  .red { color: #ff5555; }
  #inputRow { display: flex; align-items: center; }
  #promptLabel { white-space: pre; }
  #inputWrap { position: relative; flex: 1; min-width: 0; height: 1.3em; overflow: hidden; }
  #cmdInput {
    position: absolute; inset: 0; width: 100%;
    background: transparent; border: 0; outline: 0;
    color: inherit; font: inherit; font-weight: bold;
    caret-color: transparent; padding: 0; margin: 0;
  }
  .block-cursor {
    position: absolute; top: 0; left: 0; color: #c0c0c0;
    visibility: hidden; pointer-events: none; white-space: pre;
    animation: blink 1s infinite; z-index: 3;
  }
  @keyframes blink { 0%,49.99%{opacity:1;} 50%,100%{opacity:0;} }
  .measure {
    position: absolute; top: 0; left: -99999px;
    visibility: hidden; white-space: pre; font: inherit; font-weight: bold;
    pointer-events: none;
  }

  /* ============ 编辑器 ============ */
  #editorOverlay {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column;
    padding: 8px 12px;
    z-index: 10; cursor: none;
    transition: padding-top 0.25s ease;
  }
  body.touch #editorOverlay { padding-top: calc(60px + env(safe-area-inset-top)); }
  body.touch.kb-open #editorOverlay { padding-top: calc(60px + 220px + env(safe-area-inset-top)); }
  #editorOverlay.hidden { display: none; }
  #editorTitle { color: #fff; background: #0000aa; padding: 2px 8px; white-space: pre; }
  #editorWrap { position: relative; flex: 1; min-height: 0; }
  #editorArea {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #000; color: #c0c0c0; font: inherit; font-weight: bold;
    border: 0; outline: 0; resize: none; padding: 6px 0;
    white-space: pre; overflow: auto; caret-color: transparent;
    cursor: none; scrollbar-width: thin; scrollbar-color: #555 #000;
  }
  #editorArea::-webkit-scrollbar { width: 12px; height: 12px; }
  #editorArea::-webkit-scrollbar-track { background: #000; }
  #editorArea::-webkit-scrollbar-thumb { background: #444; }
  #editorHint { color: #808080; padding-top: 4px; }

  /* ============ 全屏应用（GUI / Explorer） ============ */
  .fullscreen-app {
    position: fixed; inset: 0;
    background: #0000aa;
    display: flex; flex-direction: column;
    z-index: 40;
    cursor: none;
  }
  .fullscreen-app.hidden { display: none; }

  .app-title {
    background: #c0c0c0;
    color: #000000;
    padding: 5px 10px;
    padding-top: calc(5px + env(safe-area-inset-top));
    font-weight: bold;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 0 auto;
  }

  .app-body {
    flex: 1 1 auto;
    overflow: auto;
    color: #ffffff;
    padding: 10px;
  }
  .app-body::-webkit-scrollbar { width: 12px; height: 12px; }
  .app-body::-webkit-scrollbar-track { background: #000066; }
  .app-body::-webkit-scrollbar-thumb { background: #5555aa; }

  .app-status {
    background: #c0c0c0;
    color: #000000;
    padding: 5px 10px;
    padding-bottom: calc(5px + env(safe-area-inset-bottom));
    font-weight: bold;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 0 auto;
  }
  .app-status.with-buttons {
    padding: 4px 6px;
    padding-bottom: calc(4px + env(safe-area-inset-bottom));
    white-space: normal;
    overflow: visible;
  }

  /* ---------- GUI 图标网格 ---------- */
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 12px;
    align-content: start;
  }

  .gui-icon {
    background: transparent;
    border: 2px solid transparent;
    border-radius: 2px;
    padding: 8px 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #ffffff;
    cursor: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 88px;
  }

  /* 真正的反色：用 filter: invert 反转整个方块 */
  .gui-icon:hover,
  .gui-icon.selected {
    background: #0000aa;
    border-color: #0000aa;
    filter: invert(1);
  }

  .gui-icon .icon-img {
    font-size: 30px; line-height: 1; margin-bottom: 6px;
    font-family: "SVGAFix", "Consolas", "Courier New", monospace;
  }
  .gui-icon .icon-title {
    font-size: 13px; text-align: center;
    word-break: break-word; line-height: 1.2;
  }

  /* ---------- Explorer 列表 ---------- */
  .exp-list { padding: 0; margin: 0; }
  .exp-item {
    padding: 6px 12px;
    color: #ffffff;
    cursor: none;
    white-space: pre;
    font-family: "SVGAFix", "Consolas", "Courier New", monospace;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-size: 14px;
  }

  /* 真正的反色：用 filter: invert 反转整行 */
  .exp-item:hover,
  .exp-item.selected {
    background: #0000aa;
    filter: invert(1);
  }

  .exp-item .tag { color: #ffff55; margin-right: 8px; }
  .exp-item.dir .tag { color: #55ffff; }
  .exp-item.parent .tag { color: #55ff55; }

  /* ---------- Explorer 底部按钮 ---------- */
  .exp-buttons { display: flex; flex-wrap: wrap; gap: 3px; }
  .exp-buttons button {
    flex: 1 1 auto;
    min-width: 60px;
    background: #c0c0c0;
    border: 1px solid #808080;
    border-top-color: #ffffff;
    border-left-color: #ffffff;
    color: #000000;
    font-family: inherit;
    font-weight: bold;
    font-size: 12px;
    padding: 6px 8px;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    user-select: none; -webkit-user-select: none;
  }
  .exp-buttons button:active {
    border-top-color: #808080;
    border-left-color: #808080;
    background: #a0a0a0;
  }
</style>
</head>
<body>

<div id="screen">
  <div id="output"></div>
  <div id="inputRow" class="line">
    <span id="promptLabel">C:\&gt;</span>
    <span id="inputWrap">
      <input id="cmdInput" type="text" spellcheck="false" autocomplete="off" autocapitalize="off">
      <span id="blockCursor" class="block-cursor">▮</span>
      <span id="cmdMeasure" class="measure"></span>
    </span>
  </div>
</div>

<div id="editorOverlay" class="hidden">
  <div id="editorTitle">EDIT</div>
  <div id="editorWrap">
    <textarea id="editorArea" spellcheck="false"></textarea>
    <span id="editorCursor" class="block-cursor">▮</span>
    <span id="editorMeasure" class="measure"></span>
  </div>
  <div id="editorHint">Ctrl+S = Save &amp; Exit&nbsp;&nbsp;|&nbsp;&nbsp;Esc = Cancel</div>
</div>

<!-- GUI (fullscreen) -->
<div id="guiOverlay" class="fullscreen-app hidden">
  <div class="app-title" id="guiTitle">-OS GUI</div>
  <div class="app-body">
    <div class="icon-grid" id="guiIcons"></div>
  </div>
  <div class="app-status" id="guiStatus">↑↓←→ Navigate   Enter Open   Esc Close</div>
</div>

<!-- Explorer (fullscreen) -->
<div id="explorerOverlay" class="fullscreen-app hidden">
  <div class="app-title" id="expTitle">-OS Explorer</div>
  <div class="app-body">
    <div class="exp-list" id="expList"></div>
  </div>
  <div class="app-status with-buttons">
    <div class="exp-buttons" id="explorerButtons">
      <button type="button" data-act="up">Up</button>
      <button type="button" data-act="down">Down</button>
      <button type="button" data-act="open">Open</button>
      <button type="button" data-act="rename">Rename</button>
      <button type="button" data-act="copy">Copy</button>
      <button type="button" data-act="cut">Cut</button>
      <button type="button" data-act="paste">Paste</button>
      <button type="button" data-act="new">New</button>
      <button type="button" data-act="newfolder">NewFolder</button>
      <button type="button" data-act="delete">Del</button>
      <button type="button" data-act="close">Esc</button>
    </div>
  </div>
</div>

<div id="topWrap">
  <div id="mobileKeys">
    <button type="button" data-mod="ctrl">Ctrl</button>
    <button type="button" data-mod="alt">Alt</button>
    <button type="button" data-mod="shift">Shift</button>
    <button type="button" data-key="esc">Esc</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="left">←</button>
    <button type="button" data-key="right">→</button>
    <button type="button" data-key="up">↑</button>
    <button type="button" data-key="down">↓</button>
    <button type="button" data-key="enter">↵</button>
  </div>
  <div id="keyboardPanel"></div>
</div>

<script>
/* ========== DOM ========== */
const screenEl = document.getElementById('screen');
const outputEl = document.getElementById('output');
const inputEl  = document.getElementById('cmdInput');
const promptEl = document.getElementById('promptLabel');
const blockCursor  = document.getElementById('blockCursor');
const cmdMeasure   = document.getElementById('cmdMeasure');
const editorOverlay = document.getElementById('editorOverlay');
const editorTitle   = document.getElementById('editorTitle');
const editorArea    = document.getElementById('editorArea');
const editorCursor  = document.getElementById('editorCursor');
const editorMeasure = document.getElementById('editorMeasure');
const mobileKeysEl  = document.getElementById('mobileKeys');
const keyboardPanel = document.getElementById('keyboardPanel');

const guiOverlay   = document.getElementById('guiOverlay');
const guiIconsEl   = document.getElementById('guiIcons');
const guiTitleEl   = document.getElementById('guiTitle');
const guiStatusEl  = document.getElementById('guiStatus');

const explorerOverlay = document.getElementById('explorerOverlay');
const expTitle        = document.getElementById('expTitle');
const expList         = document.getElementById('expList');
const explorerButtons = document.getElementById('explorerButtons');

/* ========== 设备 ========== */
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add('touch');
else         document.body.classList.add('desktop');

/* ========== 字符串 ========== */
const EN = {
  version:'-OS Version 1.0',
  badCmd:'Bad command or file name - ',
  fileNotFound:'File not found', invalidPath:'Invalid path', invalidDir:'Invalid directory',
  accessDenied:'Access denied', dirExists:'Directory already exists',
  dirNotEmpty:'Directory not empty', fileExists:'File already exists',
  missingParam:'Required parameter missing', invalidParam:'Invalid parameter',
  fileCopied:'        1 File(s) copied.',
  saving:'Saving', savedTo:'Saved to your computer: ', saveCancelled:'Save cancelled.',
  written:'Written', loadingPy:'Loading Python runtime (first run downloads ~10 MB) ...',
  pyReady:'Python runtime ready.', formatDone:'Format complete.',
  formatWarn1:'WARNING: All data on the virtual disk will be lost!',
  formatWarn2:'To proceed, type: FORMAT C: /Y',
  factoryReset:'Factory settings restored.',
  exit1:'It is now safe to turn off your computer.',
  exit2:'(Refresh this page to restart)',
  volumeIn:' Volume in drive C is -OS',
  volumeSerial:' Volume Serial Number is 1A2B-3C4D',
  dirOf:' Directory of ', fileCount:'File(s)', dirCount:'Dir(s)',
  bytesFree:'bytes free', byteUnit:'bytes',
  currentDate:'Current date is ', currentTime:'Current time is ',
  usagePy:'Usage: PY <filename.py>',
  usageStart:'Usage: START <filename> <NOTEPAD|PY|PYTHON>',
  startBadApp:'Unknown application - ',
  chooseFolder:'Please choose a folder in the dialog ...',
  savedAll:'The whole virtual disk has been saved to the selected folder.',
  cancelled:'Cancelled.', saveFailed:'Save failed: ',
  noFolderSupport:'Folder selection is not supported here; downloading ',
  filesWord:' file(s) ...', allDownloads:'All downloads complete.',
  selectFiles:'Select the file(s) to load into the virtual disk ...', loaded:'Loaded ',
  treeHeader1:'Directory PATH listing', treeHeader2:'Volume Serial Number is 1A2B-3C4D',
  helpTitle:'-OS Command Interpreter 1.0 — available commands:',
  langLoading:'Translating via MyMemory API ...',
  langSet:'Language set to ',
  langUsage:'Usage: LANG <code>    (e.g. LANG ja, LANG fr, LANG zh-CN, LANG de)',
  langHelp:'Supported codes: en zh-CN zh-TW ja ko fr de es pt it ru ar hi th vi id tr pl nl sv da fi no cs el he uk hu ro',
  langFail:'Translation failed: ',
  importConfirm:'Are you sure you want to import the disk? Importing the disk will delete the current information.',
  importDone:'Disk imported successfully.', importBad:'Invalid disk file.',
  importPick:'Select a MSDOS_DISK.json file to import ...',
  importCancelled:'Import cancelled.',
  exportDone:'Disk exported successfully.', exportName:'MSDOS_DISK.json',
  helpCmds:[
    '  HELP             Show this help screen',
    '  DIR  [path]      List files and subdirectories',
    '  CD   path        Display or change the current directory',
    '  MD   name        Create a directory',
    '  RD   name        Remove an empty directory',
    '  TYPE filename    Display the contents of a text file',
    '  COPY src dst     Copy a file',
    '  DEL  filename    Delete a file',
    '  REN  old new     Rename a file',
    '  EDIT filename    Edit a text file (Ctrl+S saves)',
    '  ECHO text >file  Display text, or write text into a file',
    '  START file app   Open a file with an application',
    '  GUI              Open the Graphical User Interface',
    '  EXPLORER         Open the file manager',
    '  TREE             Show the directory structure as a tree',
    '  CLS              Clear the screen',
    '  VER              Show the version',
    '  DATE / TIME      Show the date / time',
    '',
    '  -- Python --',
    '  PY     file.py   Run a Python script (uses Pyodide/WASM)',
    '  PYTHON file.py   Same as PY',
    '',
    '  -- Language --',
    '  LANG             Show usage',
    '  LANG <code>      Switch UI language (MyMemory API)',
    '',
    '  -- Import / Export the whole disk --',
    '  IMPORT           Import a MSDOS_DISK.json (asks for confirmation)',
    '  IMPORTDATA       Same as IMPORT',
    '  EXPORT           Save the whole disk as MSDOS_DISK.json',
    '',
    '  -- Exchange single files with your real computer --',
    '  SAVE   filename  Save one file to your real computer',
    '  SAVEALL          Save the whole virtual disk to a real folder',
    '  LOAD             Load files from your real computer',
    '',
    '  -- Maintenance --',
    '  FORMAT C: /Y     Erase the virtual disk',
    '  RESET            Restore factory settings',
    '  EXIT             Quit the prompt'
  ]
};
function t(k) { return EN[k] !== undefined ? EN[k] : k; }

/* ========== 翻译 ========== */
let targetLang = null;
const trCache = new Map();
async function translateText(text) {
  if (!targetLang || !text) return text;
  if (trCache.has(text)) return trCache.get(text);
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=en|' + encodeURIComponent(targetLang);
    const r = await fetch(url);
    const data = await r.json();
    const tr = (data && data.responseData && data.responseData.translatedText) || text;
    trCache.set(text, tr);
    return tr;
  } catch (e) { return text; }
}
async function setLanguage(code) {
  if (!code) { print(t('langUsage')); print(t('langHelp')); return; }
  code = String(code).trim();
  const low = code.toLowerCase();
  if (low === 'zh' || low === 'cn') code = 'zh-CN';
  else if (low === 'tw') code = 'zh-TW';
  else if (low === 'jp') code = 'ja';
  else if (low === 'kr') code = 'ko';
  else if (low === 'se') code = 'sv';
  targetLang = code;
  document.documentElement.lang = code;
  try { localStorage.setItem('msdos-lang', code); } catch (e) {}
  print(t('langLoading'));
  const nodes = outputEl.querySelectorAll('[data-src]');
  for (const el of nodes) {
    if (el.dataset.notrans) continue;
    const src = el.dataset.src;
    if (src) el.textContent = await translateText(src);
  }
  print(t('langSet') + code);
}

/* ========== 虚拟磁盘 ========== */
let cwd = [];
function defaultDisk() {
  return { name:'C:', type:'dir', children:{
    'DOS': { type:'dir', children:{} },
    'PY':  { type:'dir', children:{} },
    'CONFIG.SYS': { type:'file', content:
      'DEVICE=HIMEM.SYS\nDOS=HIGH,UMB\nFILES=40\nBUFFERS=20\n' },
    'README.TXT': { type:'file', content:
      '-OS Command Prompt\n==================\n\n' +
      'Commands:\n  HELP / DIR / CD / MD / RD\n  TYPE / COPY / DEL / REN\n' +
      '  EDIT <file>         edit a text file\n  START <file> <app>  open a file with an application\n' +
      '  GUI                 open the Graphical User Interface\n  EXPLORER            open the file manager\n' +
      '  PY <file.py>        run a Python script\n' +
      '  LANG <code>         switch UI language\n  IMPORT / EXPORT     whole-disk backup as JSON\n' +
      '  SAVE / SAVEALL / LOAD\n  FORMAT / RESET / EXIT\n' },
    'HELLO.PY': { type:'file', content:
      '# HELLO.PY - a tiny Python demo\nprint("Hello from Python!")\n' +
      'print("2 + 3 =", 2 + 3)\n\nfor i in range(5):\n    print("count:", i)\n' }
  }};
}
let disk = defaultDisk();
function saveDisk() { try { localStorage.setItem('msdos-disk-v1', JSON.stringify({disk,cwd})); } catch(e){} }
function loadDisk() {
  try { const r = localStorage.getItem('msdos-disk-v1'); if (!r) return;
    const d = JSON.parse(r); if (d && d.disk) { disk = d.disk; cwd = d.cwd || []; }
  } catch(e){}
}

/* ========== 路径 ========== */
function parsePath(str, base) {
  str = String(str==null?'':str).trim();
  let parts;
  if (!str) return [...base];
  if (str.startsWith('\\') || str.startsWith('/') || /^[A-Za-z]:/.test(str)) {
    parts = []; str = str.replace(/^[A-Za-z]:/,'').replace(/^[\\\/]+/,'');
  } else { parts = [...base]; }
  for (const seg of str.split(/[\\\/]+/)) {
    if (!seg || seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg.toUpperCase());
  }
  return parts;
}
function getNode(p) { let n = disk; for (const s of p) { if (!n.children || !n.children[s]) return null; n = n.children[s]; } return n; }
function getParent(p) { return getNode(p.slice(0, -1)); }
function pathString(p) { return 'C:\\' + p.join('\\'); }
function promptString() { return pathString(cwd) + '>'; }
function updatePrompt() { promptEl.textContent = promptString(); refreshCmdCursor(); }

/* ========== 输出 ========== */
function print(text, skipTranslate) {
  const div = document.createElement('div');
  div.className = 'line';
  const s = (text===undefined||text===null) ? '' : String(text);
  div.dataset.src = s;
  div.textContent = s;
  outputEl.appendChild(div);
  scrollBottom();
  if (!skipTranslate && targetLang && s) {
    translateText(s).then(tr => { div.textContent = tr; });
  }
}
function printRaw(text) { print(text, true); }
function scrollBottom() { screenEl.scrollTop = screenEl.scrollHeight; }

/* ========== 小工具 ========== */
function padName(n) { n = String(n); return n.length >= 12 ? n.slice(0,12) : n.padEnd(12,' '); }
function sizeStr(n) { return String(n).padStart(9, ' '); }
function dateStr() {
  const d = new Date(), p = x => String(x).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())}-${String(d.getFullYear()).slice(-2)}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function tokenize(line) {
  const out = []; let cur = '', q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; continue; }
    if (!q && /\s/.test(ch)) { if (cur) { out.push(cur); cur=''; } continue; }
    cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function splitRedirect(line) {
  let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { q = !q; continue; }
    if (!q && ch === '>') return { cmd: line.slice(0,i).trim(), out: line.slice(i+1).trim() };
  }
  return { cmd: line.trim(), out: null };
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

  const lineHeight = parseFloat(cs.lineHeight) || (fontSize * 1.3);
  const padLeft = parseFloat(cs.paddingLeft) || 0;
  const padTop  = parseFloat(cs.paddingTop) || 0;
  const text  = editorArea.value.slice(0, editorArea.selectionStart);
  const lines = text.split('\n');

  editorMeasure.textContent = colText;

let pyodidePromise = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}
async function getPyodide() {
  if (pyodidePromise) return pyodidePromise;
  pyodidePromise = (async () => {
    print(t('loadingPy'));
    if (!window.loadPyodide) await loadScript('https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js');
    const py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' });
    py.globals.set('__js_input__', p => { const r = window.prompt(p||''); return r===null?'':r; });
    await py.runPythonAsync(
      'import builtins\n' +
      'def _msdos_input(prompt=""):\n    return __js_input__(prompt)\n' +
      'builtins.input = _msdos_input\n');
    print(t('pyReady'));
    return py;
  })();
  return pyodidePromise;
}
async function runPythonFile(path) {
  const node = getNode(path);
  if (!node || node.type !== 'file') { print(t('fileNotFound')); return; }
  let py;
  try { py = await getPyodide(); } catch (e) { print('Error: ' + e.message); return; }
  py.setStdout({ batched: s => printRaw(s) });
  py.setStderr({ batched: s => printRaw(s) });
  py.globals.set('__msdos_argv__', py.toPy([path[path.length-1]]));
  try {
    await py.runPythonAsync('import sys\nsys.argv = list(__msdos_argv__)\n' + node.content);
  } catch (err) {
    printRaw('Traceback (most recent call last):');
    printRaw(String(err.message || err).replace(/^PythonError:\s*/, ''));
  } finally {
    try { py.setStdout({}); py.setStderr({}); } catch(e){}
  }
}

/* ========== 真实电脑文件交换 ========== */
async function saveFileToRealPC(filename, content) {
  const blob = new Blob([content], { type:'text/plain;charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: filename });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}
async function writeTree(dirHandle, node) {
  for (const [name, child] of Object.entries(node.children)) {
    if (child.type === 'dir') {
      const sub = await dirHandle.getDirectoryHandle(name, { create: true });
      await writeTree(sub, child);
    } else {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(new Blob([child.content], { type:'text/plain;charset=utf-8' }));
      await w.close();
    }
  }
}
function collectFiles(node, prefix, out) {
  out = out || [];
  for (const [name, child] of Object.entries(node.children)) {
    if (child.type === 'dir') collectFiles(child, prefix + name + '_', out);
    else out.push({ name: prefix + name, content: child.content });
  }
  return out;
}

  const fname = p[p.length-1];

}

  print(t('noFolderSupport') + files.length + t('filesWord'));

  print(t('allDownloads'));

async function runCommand(line) {
  const { cmd, out } = splitRedirect(line);
  const tokens = tokenize(cmd);
  if (!tokens.length) return;
  const name = tokens[0].toUpperCase();
  const args = tokens.slice(1);
  const fn = COMMANDS[name];
  if (!fn) { print(t('badCmd') + tokens[0]); return; }
  await fn(args, out);
}

      '<div class="icon-title">' + escapeHTML(icon.title) + '</div>';
    el.addEventListener('click', () => { guiSel = i; guiActivate(); });
    el.addEventListener('mouseenter', () => {
      guiSel = i;
      guiIconsEl.querySelectorAll('.gui-icon').forEach((n, k) => {
        n.classList.toggle('selected', k === i);
      });
    });
    guiIconsEl.appendChild(el);
  });

  if (!explorerOverlay.classList.contains('hidden')) closeExplorer();
  guiSel = 0;
  renderGUI();
  guiOverlay.classList.remove('hidden');
}

  guiOverlay.classList.add('hidden');
  inputEl.focus();
  refreshCmdCursor();

function guiNavigate(dx, dy) {
  const cols = getGUICols();
  const n = GUI_ICONS.length;
  let idx = guiSel;
  if (dx === -1) idx = Math.max(0, idx - 1);
  else if (dx === 1) idx = Math.min(n - 1, idx + 1);
  else if (dy === -1) idx = Math.max(0, idx - cols);
  else if (dy === 1) { const nx = idx + cols; if (nx < n) idx = nx; }
  if (idx !== guiSel) { guiSel = idx; renderGUI(); }
}

function guiActivate() {
  const icon = GUI_ICONS[guiSel];
  if (!icon) return;
  if (icon.id === 'exit') { closeGUI(); return; }
  if (icon.id === 'notepad') {
    closeGUI();
    cmdEdit(['README.TXT']);
    return;
  }
  if (icon.id === 'explorer') {
    closeGUI();
    cmdExplorer();
    return;
  }
  if (icon.id === 'python') {
    closeGUI();
    print('');
    print('Python is available from the command line:');
    print('  PY <file.py>');
    print('  START <file> PY');
    print('');
    return;
  }
  if (icon.id === 'about') {
    closeGUI();
    print('');
    print('-OS Version 1.0');
    print('A text-mode graphical user interface running in your browser.');
    print('Type HELP at the prompt for a list of commands.');
    print('');
    return;
  }
}

    el.className = cls;
    const tag = item.type === 'dir'    ? '[DIR]'
              : item.type === 'parent' ? '[UP] '
              :                          '[FILE]';
    el.innerHTML = '<span class="tag">' + tag + '</span>' + escapeHTML(item.name);
    el.addEventListener('click', () => { expSel = i; expEnter(); });
    el.addEventListener('mouseenter', () => {
      expSel = i;
      expList.querySelectorAll('.exp-item').forEach((n, k) => {
        n.classList.toggle('selected', k === i);
      });
    });
    expList.appendChild(el);
  });
}

function openExplorer() {
  if (!guiOverlay.classList.contains('hidden')) closeGUI();
  expCwd = [...cwd];
  expSel = 0;
  expClipboard = null;
  renderExplorer();
  explorerOverlay.classList.remove('hidden');
}

function closeExplorer() {
  explorerOverlay.classList.add('hidden');
  inputEl.focus();
  refreshCmdCursor();
}

function expEnter() {
  const items = getExplorerItems();
  const item = items[expSel];
  if (!item) return;
  if (item.type === 'parent') {
    expCwd.pop();
    expSel = 0;
    renderExplorer();
    return;
  }
  const fullPath = [...expCwd, item.name];
  const node = getNode(fullPath);
  if (!node) return;
  if (node.type === 'dir') {
    expCwd = fullPath;
    expSel = 0;
    renderExplorer();
  } else {
    closeExplorer();
    openEditorFor(fullPath);
  }
}

function expRename() {
  const items = getExplorerItems();
  const item = items[expSel];
  if (!item || item.type === 'parent') return;

  const newName = window.prompt('Rename "' + item.name + '" to:', item.name);
  if (newName === null) return;
  const clean = newName.trim().replace(/[\\\/:*?"<>|]/g, '').toUpperCase();
  if (!clean || clean === item.name) return;

  const parent = getNode(expCwd);
  if (!parent || parent.type !== 'dir') return;
  if (parent.children[clean]) { print(t('fileExists')); return; }

  parent.children[clean] = parent.children[item.name];
  delete parent.children[item.name];
  saveDisk();
  renderExplorer();
}

function expCopy() {
  const items = getExplorerItems();
  const item = items[expSel];
  if (!item || item.type === 'parent') return;
  expClipboard = { mode:'copy', name: item.name, path: [...expCwd, item.name] };
  renderExplorer();
}

function expCut() {
  const items = getExplorerItems();
  const item = items[expSel];
  if (!item || item.type === 'parent') return;
  expClipboard = { mode:'cut', name: item.name, path: [...expCwd, item.name] };
  renderExplorer();
}

function expPaste() {
  if (!expClipboard) return;
  const parent = getNode(expCwd);
  if (!parent || parent.type !== 'dir') return;

  const src = getNode(expClipboard.path);
  if (!src) { expClipboard = null; renderExplorer(); return; }

  let targetName = expClipboard.name;
  if (parent.children[targetName]) {
    let base = expClipboard.name, ext = '';
    const dot = base.lastIndexOf('.');
    if (dot > 0) { ext = base.slice(dot); base = base.slice(0, dot); }
    let n = 1;
    while (parent.children[base + n + ext]) n++;
    targetName = base + n + ext;
  }

  if (expClipboard.mode === 'copy') {
    parent.children[targetName] = JSON.parse(JSON.stringify(src));
  } else {
    parent.children[targetName] = src;
    const srcParent = getParent(expClipboard.path);
    if (srcParent) delete srcParent.children[expClipboard.name];
    expClipboard = null;
  }
  saveDisk();
  renderExplorer();
}

function expNew() {
  const parent = getNode(expCwd);
  if (!parent || parent.type !== 'dir') return;
  let n = 1, name;
  do { name = 'NEWFILE' + n; n++; } while (parent.children[name]);
  parent.children[name] = { type:'file', content: '' };
  saveDisk();
  const items = getExplorerItems();
  const idx = items.findIndex(it => it.name === name);
  if (idx >= 0) expSel = idx;
  renderExplorer();
}

function expNewFolder() {
  const parent = getNode(expCwd);
  if (!parent || parent.type !== 'dir') return;
  let n = 1, name;
  do { name = 'NEWFOLDER' + n; n++; } while (parent.children[name]);
  parent.children[name] = { type:'dir', children:{} };
  saveDisk();
  const items = getExplorerItems();
  const idx = items.findIndex(it => it.name === name);
  if (idx >= 0) expSel = idx;
  renderExplorer();
}

function expDelete() {
  const items = getExplorerItems();
  const item = items[expSel];
  if (!item || item.type === 'parent') return;
  const parent = getNode(expCwd);
  if (!parent || parent.type !== 'dir') return;
  const node = parent.children[item.name];
  if (!node) return;
  if (node.type === 'dir' && Object.keys(node.children).length) {
    print(t('dirNotEmpty'));
    return;
  }
  if (!window.confirm('Delete "' + item.name + '"?')) return;
  delete parent.children[item.name];
  saveDisk();
  const items2 = getExplorerItems();
  if (expSel >= items2.length) expSel = Math.max(0, items2.length - 1);
  renderExplorer();
}

function cmdExplorer() { openExplorer(); }

/* ========== Explorer 底部按钮 ========== */
explorerButtons.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  switch (act) {
    case 'up':    expSel = Math.max(0, expSel - 1); renderExplorer(); break;
    case 'down': {
      const items = getExplorerItems();
      expSel = Math.min(items.length - 1, expSel + 1);
      renderExplorer();
      break;
    }
    case 'open':      expEnter();     break;
    case 'rename':    expRename();    break;
    case 'copy':      expCopy();      break;
    case 'cut':       expCut();       break;
    case 'paste':     expPaste();     break;
    case 'new':       expNew();       break;
    case 'newfolder': expNewFolder(); break;
    case 'delete':    expDelete();    break;
    case 'close':     closeExplorer(); break;
  }
});

/* ========== Explorer 键盘 ========== */
document.addEventListener('keydown', e => {
  if (explorerOverlay.classList.contains('hidden')) return;
  let handled = true;
  if (e.key === 'Escape') closeExplorer();
  else if (e.key === 'ArrowUp') { expSel = Math.max(0, expSel - 1); renderExplorer(); }
  else if (e.key === 'ArrowDown') {
    const items = getExplorerItems();
    expSel = Math.min(items.length - 1, expSel + 1);
    renderExplorer();
  }
  else if (e.key === 'Enter') expEnter();
  else if (e.key === 'Delete' || e.key === 'Backspace') expDelete();
  else {
    const k = e.key.toUpperCase();
    if (k === 'R' && !e.ctrlKey && !e.altKey && !e.metaKey)      expRename();
    else if (k === 'C' && !e.ctrlKey && !e.altKey && !e.metaKey) expCopy();
    else if (k === 'X' && !e.ctrlKey && !e.altKey && !e.metaKey) expCut();
    else if (k === 'V' && !e.ctrlKey && !e.altKey && !e.metaKey) expPaste();
    else if (k === 'N' && !e.ctrlKey && !e.altKey && !e.metaKey) expNew();
    else if (k === 'F' && !e.ctrlKey && !e.altKey && !e.metaKey) expNewFolder();
    else handled = false;
  }
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}, true);

/* =========================================================
   键盘面板
   ========================================================= */
const KB_ROWS = [
  { row:'num', keys:['1','2','3','4','5','6','7','8','9','0'] },
  { row:'q1',  keys:['q','w','e','r','t','y','u','i','o','p'] },
  { row:'q2',  keys:['a','s','d','f','g','h','j','k','l'] },
  { row:'q3',  keys:['z','x','c','v','b','n','m'] },
  { row:'sym', keys:['`','-','=','[',']','\\',';',"'",',','.','/'] }
];
(function buildKeyboard() {
  for (const r of KB_ROWS) {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    rowEl.dataset.row = r.row;
    for (const k of r.keys) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'kb-key';
      b.dataset.key = k;
      b.textContent = k;
      rowEl.appendChild(b);
    }
    keyboardPanel.appendChild(rowEl);
  }
})();

/* ========== 组合键 ========== */
const SHIFT_MAP = {
  '1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')',
  '-':'_','=':'+','[':'{',']':'}','\\':'|',';':':',"'":'"',',':'<','.':'>','/':'?','`':'~'
};

function triggerCombo(mod, key) {
  const isEditor = !editorOverlay.classList.contains('hidden');
  const el = isEditor ? editorArea : inputEl;

  if (mod === 'ctrl') {
    const k = key.toLowerCase();
    if (k === 's') { if (isEditor) { saveEditorFile(); closeEditor(); } return true; }
    if (k === 'l') { outputEl.innerHTML = ''; return true; }
    if (k === 'c') {
      pendingConfirm = null;
      if (isEditor) { editorArea.value = ''; refreshEditorCursor(); }
      else { inputEl.value = ''; refreshCmdCursor(); }
      return true;
    }
    if (k === 'a') {
      el.focus(); el.select();
      if (isEditor) refreshEditorCursor(); else refreshCmdCursor();
      return true;
    }
    return false;
  }
  if (mod === 'alt') return false;
  if (mod === 'shift') {
    let ch = key;
    if (/^[a-z]$/.test(key)) ch = key.toUpperCase();
    else if (SHIFT_MAP[key]) ch = SHIFT_MAP[key];
    const s = el.selectionStart, e = el.selectionEnd;
    el.value = el.value.slice(0, s) + ch + el.value.slice(e);
    el.selectionStart = el.selectionEnd = s + ch.length;
    if (isEditor) refreshEditorCursor(); else refreshCmdCursor();
    return true;
  }
  return false;
}

/* ========== 键盘面板开关 ========== */
let activeMod = null;
let kbActiveBtn = null;

function openKeyboard(mod) {
  activeMod = mod;
  mobileKeysEl.querySelectorAll('button[data-mod]').forEach(b => {
    b.classList.toggle('active', b.dataset.mod === mod);
  });
  keyboardPanel.classList.add('visible');
  document.body.classList.add('kb-open');
}
function closeKeyboard() {
  activeMod = null;
  kbActiveBtn = null;
  mobileKeysEl.querySelectorAll('button[data-mod]').forEach(b => b.classList.remove('active'));
  keyboardPanel.classList.remove('visible');
  keyboardPanel.querySelectorAll('.kb-key.active').forEach(b => b.classList.remove('active'));
  document.body.classList.remove('kb-open');
}

keyboardPanel.addEventListener('pointerdown', e => {
  const btn = e.target.closest ? e.target.closest('.kb-key') : null;
  if (!btn) return;
  e.preventDefault();
  if (kbActiveBtn) kbActiveBtn.classList.remove('active');
  kbActiveBtn = btn;
  btn.classList.add('active');
});

document.addEventListener('pointerup', e => {
  if (!kbActiveBtn) return;
  const btn = (e.target && e.target.closest) ? e.target.closest('.kb-key') : null;
  if (btn === kbActiveBtn) {
    const key = kbActiveBtn.dataset.key;
    const mod = activeMod;
    kbActiveBtn.classList.remove('active');
    kbActiveBtn = null;
    closeKeyboard();
    if (mod) triggerCombo(mod, key);
  } else {
    kbActiveBtn.classList.remove('active');
    kbActiveBtn = null;
  }
});

document.addEventListener('pointerdown', e => {
  if (!keyboardPanel.classList.contains('visible')) return;
  if (keyboardPanel.contains(e.target)) return;
  if (mobileKeysEl.contains(e.target)) return;
  closeKeyboard();
}, true);

/* =========================================================
   屏幕按键栏
   ========================================================= */
let mobileBtnPointer = null;

mobileKeysEl.addEventListener('pointerdown', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  e.preventDefault();
  mobileBtnPointer = btn;
});

mobileKeysEl.addEventListener('pointerup', e => {
  const btn = e.target.closest('button');
  if (!btn || btn !== mobileBtnPointer) { mobileBtnPointer = null; return; }
  mobileBtnPointer = null;

  if (btn.dataset.mod) {
    const m = btn.dataset.mod;
    if (activeMod === m && keyboardPanel.classList.contains('visible')) closeKeyboard();
    else openKeyboard(m);
    return;
  }

  const key = btn.dataset.key;
  if (key) handleMobileKey(key);
});

mobileKeysEl.addEventListener('pointercancel', () => { mobileBtnPointer = null; });
mobileKeysEl.addEventListener('pointerleave', () => { mobileBtnPointer = null; });

/* =========================================================
   功能键动作
   ========================================================= */
function commandComplete() {
  const val = inputEl.value;
  if (!val.trim()) return;
  const m = val.match(/^(\s*)(\S*)$/);
  if (!m) return;
  const prefix = m[2].toUpperCase();
  if (!prefix) return;
  const names = Object.keys(COMMANDS).filter(n => n.startsWith(prefix));
  if (names.length === 0) return;
  if (names.length === 1) {
    inputEl.value = m[1] + names[0] + ' ';
    inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length;
    refreshCmdCursor();
  } else {
    print('');
    print(names.join('  '));
  }
}

function handleMobileKey(key) {
  /* Explorer 优先 */
  if (!explorerOverlay.classList.contains('hidden')) {
    if (key === 'esc') closeExplorer();
    else if (key === 'up') { expSel = Math.max(0, expSel - 1); renderExplorer(); }
    else if (key === 'down') {
      const items = getExplorerItems();
      expSel = Math.min(items.length - 1, expSel + 1);
      renderExplorer();
    }
    else if (key === 'enter' || key === 'tab') expEnter();
    return;
  }

  /* GUI 次之 */
  if (!guiOverlay.classList.contains('hidden')) {
    if (key === 'esc') closeGUI();
    else if (key === 'up') guiNavigate(0, -1);
    else if (key === 'down') guiNavigate(0, 1);
    else if (key === 'left') guiNavigate(-1, 0);
    else if (key === 'right') guiNavigate(1, 0);
    else if (key === 'tab' || key === 'enter') guiActivate();
    return;
  }

  const isEditor = !editorOverlay.classList.contains('hidden');

  if (key === 'esc') {
    closeKeyboard();
    if (isEditor) closeEditor();
    else { inputEl.value = ''; refreshCmdCursor(); }
    return;
  }

  const el = isEditor ? editorArea : inputEl;

  if (key === 'tab') {
    if (isEditor) {
      const s = el.selectionStart, e = el.selectionEnd;
      el.value = el.value.slice(0, s) + '\t' + el.value.slice(e);
      el.selectionStart = el.selectionEnd = s + 1;
      refreshEditorCursor();
    } else {
      commandComplete();
    }
    return;
  }

  if (key === 'enter') {
    if (isEditor) {
      const s = el.selectionStart, e = el.selectionEnd;
      el.value = el.value.slice(0, s) + '\n' + el.value.slice(e);
      el.selectionStart = el.selectionEnd = s + 1;
      refreshEditorCursor();
    } else {
      inputEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
    return;
  }

  if (key === 'up' || key === 'down') {
    if (!isEditor) {
      if (!history.length) return;
      if (key === 'up') histIdx = Math.max(0, histIdx - 1);
      else histIdx = Math.min(history.length, histIdx + 1);
      inputEl.value = history[histIdx] || '';
      setTimeout(() => {
        inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length;
        refreshCmdCursor();
      }, 0);
    } else {
      const v = el.value;
      const pos = el.selectionStart;
      const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
      const col = pos - lineStart;
      if (key === 'up') {
        if (lineStart === 0) return;
        const prevEnd = lineStart - 1;
        const prevStart = v.lastIndexOf('\n', prevEnd - 1) + 1;
        el.selectionStart = el.selectionEnd = Math.min(prevStart + col, prevEnd);
      } else {
        const lineEnd = v.indexOf('\n', pos);
        if (lineEnd === -1) return;
        const nextStart = lineEnd + 1;
        const nextEnd = v.indexOf('\n', nextStart);
        const maxLen = nextEnd === -1 ? v.length : nextEnd;
        el.selectionStart = el.selectionEnd = Math.min(nextStart + col, maxLen);
      }
      refreshEditorCursor();
    }
    return;
  }

  if (key === 'left' || key === 'right') {
    const dir = key === 'left' ? -1 : 1;
    const cur = dir < 0 ? el.selectionStart : el.selectionEnd;
    const newPos = Math.max(0, Math.min(el.value.length, cur + dir));
    el.selectionStart = el.selectionEnd = newPos;
    if (isEditor) refreshEditorCursor();
    else refreshCmdCursor();
    return;
  }
}

/* =========================================================
   物理键盘
   ========================================================= */
document.addEventListener('keydown', e => {
  if (guiOverlay.classList.contains('hidden')) return;
  let handled = true;
  if (e.key === 'Escape') closeGUI();
  else if (e.key === 'ArrowUp')    guiNavigate(0, -1);
  else if (e.key === 'ArrowDown')  guiNavigate(0, 1);
  else if (e.key === 'ArrowLeft')  guiNavigate(-1, 0);
  else if (e.key === 'ArrowRight') guiNavigate(1, 0);
  else if (e.key === 'Enter')      guiActivate();
  else if (e.key === 'Tab')        guiActivate();
  else handled = false;
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}, true);

function handleModKeys(e, isEditor) {
  if (e.key === 'Escape') {
    e.preventDefault();
    closeKeyboard();
    if (isEditor) closeEditor();
    else { inputEl.value = ''; refreshCmdCursor(); }
    return true;
  }
  if (e.ctrlKey && e.key.length === 1) {
    const k = e.key.toLowerCase();
    e.preventDefault();
    return triggerCombo('ctrl', k);
  }
  if (e.altKey && e.key.length === 1) {
    e.preventDefault();
    return true;
  }
  return false;
}
editorArea.addEventListener('keydown', e => { if (handleModKeys(e, true)) return; });

/* =========================================================
   输入处理
   ========================================================= */
let history = [], histIdx = 0;

inputEl.addEventListener('keydown', async e => {
  if (!guiOverlay.classList.contains('hidden')) return;
  if (!explorerOverlay.classList.contains('hidden')) return;
  if (handleModKeys(e, false)) return;

  if (e.key === 'Enter') {
    const line = inputEl.value;
    inputEl.value = '';

    if (pendingConfirm) {
      print(promptString() + line);
      const ans = line.trim().toUpperCase();
      const pc = pendingConfirm;
      pendingConfirm = null;
      if (ans === 'Y' || ans === 'YES') {
        try { await pc.onYes(); } catch (err) { print('Error: ' + err.message); }
      } else if (ans === 'N' || ans === 'NO') {
        try { await pc.onNo(); } catch (err) { print('Error: ' + err.message); }
      } else {
        print(t('badCmd') + line);
      }
      updatePrompt(); scrollBottom();
      inputEl.focus(); refreshCmdCursor();
      return;
    }

    if (line.trim()) history.push(line);
    histIdx = history.length;
    print(promptString() + line);
    try { await runCommand(line); }
    catch (err) { print('Error: ' + err.message); console.error(err); }
    updatePrompt(); scrollBottom();
    inputEl.focus(); refreshCmdCursor();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.max(0, histIdx - 1);
    inputEl.value = history[histIdx] || '';
    setTimeout(() => { inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length; refreshCmdCursor(); }, 0);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.min(history.length, histIdx + 1);
    inputEl.value = history[histIdx] || '';
    setTimeout(() => { inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length; refreshCmdCursor(); }, 0);
  }
  setTimeout(refreshCmdCursor, 0);
});

['input','keyup','click','select','focus','blur','mouseup','compositionend','scroll'].forEach(ev => {
  inputEl.addEventListener(ev, () => setTimeout(refreshCmdCursor, 0));
});
document.addEventListener('selectionchange', () => {
  if (document.activeElement === inputEl) refreshCmdCursor();
  if (document.activeElement === editorArea) refreshEditorCursor();
});
window.addEventListener('resize', () => {
  refreshCmdCursor(); refreshEditorCursor();
  if (!guiOverlay.classList.contains('hidden')) renderGUI();
  if (!explorerOverlay.classList.contains('hidden')) renderExplorer();
});
['input','keyup','keydown','click','select','focus','blur','mouseup','scroll','compositionend'].forEach(ev => {
  editorArea.addEventListener(ev, () => setTimeout(refreshEditorCursor, 0));
});
screenEl.addEventListener('click', e => {
  if (e.target === inputEl) return;
  if (window.getSelection().toString()) return;
  inputEl.focus(); refreshCmdCursor();
});

/* ========== 启动 ========== */
(function boot() {
  loadDisk();
  updatePrompt();
  print(t('version'));
  print('');

  try {
    const saved = localStorage.getItem('msdos-lang');
    if (saved) { targetLang = saved; document.documentElement.lang = saved; }
  } catch (e) {}

  inputEl.focus();
  refreshCmdCursor();
})();
